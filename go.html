<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stray Cat Map</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0f2f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .card {
    max-width: 360px;
    width: calc(100% - 48px);
    margin: 24px;
    padding: 32px 24px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    text-align: center;
  }
  .emoji { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 8px 0 4px; color: #00332e; }
  p { font-size: 14px; color: #4a5a58; line-height: 1.6; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 28px;
    background: #00897b;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  .hint { margin-top: 20px; font-size: 12px; color: #8a9998; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐾</div>
    <h1>Stray Cat Map</h1>
    <p id="message">アプリを開いています…</p>
    <a class="btn" id="openBtn" href="#">アプリで開く</a>
    <p class="hint">アプリがインストールされていない場合、このボタンを押しても何も起こりません。</p>
  </div>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type'); // 'cat' | 'sighting'
    var id = params.get('id');
    var messageEl = document.getElementById('message');
    var btnEl = document.getElementById('openBtn');

    if (!type || !id || (type !== 'cat' && type !== 'sighting')) {
      messageEl.textContent = 'このリンクは正しくないようです。';
      btnEl.style.display = 'none';
      return;
    }

    var appUrl = 'straycat://' + type + '/' + encodeURIComponent(id);
    btnEl.href = appUrl;

    // ページを開いた瞬間に一度だけ自動でアプリを開こうとする。
    // アプリが無ければ何も起きず、下の案内文がそのまま残る。
    window.location.href = appUrl;

    setTimeout(function () {
      messageEl.textContent = 'アプリがインストールされていれば、上のボタンでStray Cat Mapが開きます。';
    }, 1200);
  })();
</script>
</body>
</html>
